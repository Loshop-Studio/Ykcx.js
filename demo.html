<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Ykcx.js 横屏 WebView 演示</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17212b; background: #f3f6f8; }
    body { padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .controls { display: flex; gap: 8px; }
    .controls button { min-height: 40px; padding: 0 18px; border: 1px solid #aeb9c4; border-radius: 5px; background: #fff; color: #263747; font-size: 15px; }
    .controls button:active { background: #e2e8ee; }
    main { display: grid; grid-template-columns: minmax(280px, .8fr) minmax(380px, 1.2fr); gap: 20px; }
    section { min-width: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    label { display: block; margin: 0 0 15px; color: #4e5f6f; font-size: 13px; }
    input, textarea, [contenteditable] { display: block; width: 100%; margin-top: 7px; border: 1px solid #aeb9c4; border-radius: 5px; background: #fff; color: #17212b; font: 17px/1.5 Arial, sans-serif; outline: none; }
    input { height: 48px; padding: 0 12px; }
    textarea { min-height: 108px; padding: 10px 12px; resize: vertical; }
    [contenteditable] { min-height: 92px; padding: 10px 12px; }
    input:focus, textarea:focus, [contenteditable]:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.14); }
    article { padding: 18px 20px; border-left: 4px solid #1a73e8; background: #fff; font-size: 17px; line-height: 1.9; }
    article p { margin: 0 0 12px; }
    article p:last-child { margin-bottom: 0; }
    .status { min-width: 140px; color: #587083; font-size: 13px; }
    @media (max-width: 760px) { body { padding: 14px; } main { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Ykcx.js WebView 输入补全</h1>
      <div class="status" id="status">等待输入</div>
    </div>
    <div class="controls">
      <button type="button" id="dock">吸附底端</button>
      <button type="button" id="floating">悬浮键盘</button>
      <button type="button" id="hide">隐藏</button>
    </div>
  </header>
  <main>
    <section>
      <h2>输入控件</h2>
      <label>单行输入
        <input id="name" autocomplete="off" placeholder="点击后显示离线键盘">
      </label>
      <label>多行输入
        <textarea placeholder="支持英文、符号与中文拼音"></textarea>
      </label>
      <label>富文本
        <div contenteditable="true">这是一段可编辑文本。</div>
      </label>
    </section>
    <section>
      <h2>长按选择</h2>
      <article>
        <p>用手指长按这段文字，会选中所在词语，并显示蓝色选区手柄、复制和全选菜单。</p>
        <p>为了方便桌面调试，也可以使用鼠标左键按住约半秒。两个蓝色手柄都可以继续拖动调整选区。</p>
        <p>Long press any English word to verify word-boundary selection and the offline clipboard fallback.</p>
      </article>
    </section>
  </main>

  <script>
    window.YkcxOptions = { mode: "dock", keyboardHeight: 286 };
  </script>
  <script src="ykcx.js"></script>
  <script src="ykcx.zh.js"></script>
  <script>
    var status = document.getElementById("status");
    document.getElementById("dock").onclick = function () { Ykcx.setMode("dock"); Ykcx.show(); };
    document.getElementById("floating").onclick = function () { Ykcx.setMode("floating"); Ykcx.show(); };
    document.getElementById("hide").onclick = function () { Ykcx.hide(); };
    Ykcx.on("languagechange", function (event) { status.textContent = "当前语言：" + event.label; });
    Ykcx.on("copy", function () { status.textContent = "已复制所选文本"; });
  </script>
</body>
</html>
